<html>

<head>
    <title> bio data </title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="shortcut icon" href="Artboard 33.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>

    </style>
</head>

<body>
    <div class="header">
        <h2>BIODATA</h2>
    </div>
    <table>
        <tr>
            <td>
                <b>NAME</b>
            </td>
            <td>
                <input type="text" placeholder="type your name" class="name">
            </td>
        </tr>
        <tr>
            <td>
                <b>D.O.B</b>
            </td>
            <td>
                <input type="date" class="dob">
            </td>
        </tr>
        <tr>
            <td>
                <b name="gen"> GENDER </b>
            </td>
            <td>
                <p class="gen"><input type="radio" name="gen" > male</p>
                <p class="gen"><input type="radio" name="gen" > female</p>
            </td>
        </tr>
        <tr>
            <td>
                <b>PHONENUMBER</b>
            </td>
            <td>
                <input type="text" placeholder="type your phone number">
            </td>
        </tr>
        <tr>
            <td>
                <b>ADDRESS</b>
            </td>
            <td>
                <textarea name="" id="" cols="30" rows="4" placeholder="type your address" class="add"></textarea>
            </td>
        </tr>
        <tr>
            <td>
                <input type="submit" value="submit" onclick="printFunction()" class="sub">
            </td>
        </tr>
    </table>
    <script>
        function printFunction() {
            window.print();
            var element = document.getElementById('body');
            html2pdf().from(element).save('biodata.pdf');
        }
    </script>
</body>

</html>
