<html>

<head>
	<title> bio data </title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="shortcut icon" href="Artboard 33.png" type="image/x-icon">
	<style>
		body {
			margin: 0;
			padding: 0;
			text-decoration: none;
			font-family: Inconsolata, monospace;
			box-sizing: 90vh;
		}

		input {
			align-items: center;
			text-align: center;
			position: relative;
		}

		form {
			position: absolute;
			background: white;
			width: 500px;
			height: 720px;
			border-radius: 20px;
			margin-left: 5%;
			border-color: black;
			position: absolute;
			top: 5%;
			left: 30%;
		}
		.backdrop{
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body background="">
	<img src="wallpaper.jpg" class="backdrop">
	<div class="forrm">
		<form align="center">
		<br><br>
			<b style="color:red;font-family:roboto">TYPE YOUR PERSNOL DATA</b>

			<p><label> <b>NAME</b> </label>
				<br>
			<div id="name">
				<input type="textfield" placeholder="type your name"
					style="width:100%;border:none;outline:none;font-size:20px;color:skyblue"></p>
				<hr style="width:20%">
				<p><label> <b>D.O.B</b> </label>
					<br>
					<input type="date" class="dob"
						style="width:50%;border:none;outline:none;text-align:center;font-size:20px">
				</p>
				<hr style="width:20%">
				<p><b> AGE </b>
					<br>
					<input type="range" min="0" max="40" id="send" oninput="result.value=send.value">
					<br>
					<input text="text" id="result" oninput="send.value=result.value"
						style="width:100%;border:none;outline:none;text-align:center;font-size:20px;color:skyblue">
				</p>
				<hr style="width:20%">
				<p><b> GENDER </b>
					<br>
					<p><input type="radio" name="male"> male </p> <p><input type="radio" name="female"> female </p>

				</p>
				<hr style="width:20%">
				<p><b>PHONENUMBER</b>
					<br>
					<select style="width:60%;border:none;outline:none;text-align:center;font-size:20px;font:green">
						<option hidden="kirubha" style="outline:none"> select </option>
						<option>+559</option>
						<option>+559</option>
						<option>+111</option>
						<option>+91</option>
						<option>+90</option>
						<option>+55</option>
						<option>+789</option>
						<br>
						<br>
						<input type="text" placeholder="type your phone number"
							style="width:100%;border:none;outline:none;text-align:center;font-size:20px">
				</p>
				<hr style="width:20%">
				<p><b>ADDRESS</b>
					<br><br>
					<input type="text" placeholder="type your address"
						style="width:100%;border:none;outline:none;text-align:center;font-size:20px">
				</p>
				<br>
				<input type="submit" value="save"
					style="width:30%;font-size:20px;border-radius: 5px;background-color:lightgray;border:none;transition:0.2s;cursor: pointer;" onclick="printFunction()">
				<input type="reset" value="reset"
					style="width:30%;font-size:20px;border-radius: 5px;background-color:lightgray;border:none;cursor: pointer;">
<script>
      function printFunction() { 
        window.print(); 
		var element = document.getElementById('body');
html2pdf().from(element).save('filename.pdf');
      }
</script>
		</form>
	</div>
</body>

</html>
