<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="asset/favicon/Asset 87logowbg.png" type="image/x-icon">
  <title>Projects</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-soft: #f0f4f8;
      --text: #172033;
      --muted: #687386;
      --line: #dde4ee;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --green-bg: #dcfce7;
      --green-text: #166534;
      --amber-bg: #fef3c7;
      --amber-text: #92400e;
      --blue-bg: #dbeafe;
      --blue-text: #1e40af;
      --red-bg: #fee2e2;
      --red-text: #991b1b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .table-shell {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .table-title {
      margin: 0;
      font-size: 1rem;
    }

    .search {
      width: min(280px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text);
      font: inherit;
      padding: 10px 12px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th {
      background: #fbfcfe;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .project-name {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .project-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 8px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 900;
    }

    .muted {
      color: var(--muted);
    }

    .empty-row {
      color: var(--muted);
      text-align: center;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .open-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      padding: 0 14px;
      font-size: 0.9rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .open-button:hover {
      background: var(--accent-strong);
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 20px, 1120px);
        padding: 24px 0;
      }

      .topbar,
      .table-header {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">PK WebWorks Projects</h1>
        <p class="subtitle">A clean list of your projects with quick access to each project page.</p>
      </div>
    </section>

    <section class="table-shell" aria-labelledby="projects-table-title">
      <div class="table-header">
        <h2 class="table-title" id="projects-table-title">Project List</h2>
        <input class="search" id="project-search" type="search" placeholder="Search projects" aria-label="Search projects">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Project Name</th>
              <th>Version</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody id="projects-body">
            <tr>
              <td class="empty-row" colspan="3">Loading projects...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const tableBody = document.querySelector("#projects-body");
    const searchInput = document.querySelector("#project-search");
    let projects = [];

    function getInitial(projectName) {
      return projectName.trim().charAt(0).toUpperCase() || "?";
    }

    function renderProjects(items) {
      tableBody.innerHTML = "";

      if (!items.length) {
        tableBody.innerHTML = '<tr><td class="empty-row" colspan="3">No projects found.</td></tr>';
        return;
      }

      items.forEach((project) => {
        const row = document.createElement("tr");

        const nameCell = document.createElement("td");
        const nameWrap = document.createElement("div");
        const icon = document.createElement("span");
        const name = document.createElement("span");

        nameWrap.className = "project-name";
        icon.className = "project-icon";
        icon.textContent = getInitial(project.name);
        name.textContent = project.name;
        nameWrap.append(icon, name);
        nameCell.append(nameWrap);

        const versionCell = document.createElement("td");
        versionCell.className = "muted";
        versionCell.textContent = project.version;

        const actionCell = document.createElement("td");
        const actions = document.createElement("div");
        const link = document.createElement("a");

        actions.className = "actions";
        link.className = "open-button";
        link.href = project.link;
        link.textContent = "Open Project";
        link.setAttribute("aria-label", `Open ${project.name}`);
        actions.append(link);
        actionCell.append(actions);

        row.append(nameCell, versionCell, actionCell);
        tableBody.append(row);
      });
    }

    function filterProjects() {
      const query = searchInput.value.trim().toLowerCase();
      const filteredProjects = projects.filter((project) => {
        return project.name.toLowerCase().includes(query) || project.version.toLowerCase().includes(query);
      });

      renderProjects(filteredProjects);
    }

    fetch("./projects.json")
      .then((response) => {
        if (!response.ok) {
          throw new Error("Could not load projects.json");
        }

        return response.json();
      })
      .then((data) => {
        projects = data;
        renderProjects(projects);
      })
      .catch(() => {
        tableBody.innerHTML = '<tr><td class="empty-row" colspan="3">Unable to load projects.json.</td></tr>';
      });

    searchInput.addEventListener("input", filterProjects);
  </script>
</body>
</html>
