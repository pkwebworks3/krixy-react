<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naruto x Boruto Quiz</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Naruto x Boruto Quiz</h1>
    </header>
    <main>
        <section id="quiz">
            <h2>Question 1:</h2>
            <p>What is Naruto's last name?</p>
            <ul>
                <li>
                    <input type="radio" name="question1" id="q1-a" value="a" />
                    <label for="q1-a">Uzumaki</label>
                </li>
                <li>
                    <input type="radio" name="question1" id="q1-b" value="b" />
                    <label for="q1-b">Uchiha</label>
                </li>
                <li>
                    <input type="radio" name="question1" id="q1-c" value="c" />
                    <label for="q1-c">Namikaze</label>
                </li>
                <li>
                    <input type="radio" name="question1" id="q1-d" value="d" />
                    <label for="q1-d">Hyuga</label>
                </li>
            </ul>

            <h2>Question 2:</h2>
            <p>What is Boruto's father's name</p>
            <ul>
                <li>
                    <input type="radio" name="question2" id="q2-a" value="a" />
                    <label for="q2-a">Minato</label>
                </li>
                <li>
                    <input type="radio" name="question2" id="q2-b" value="b" />
                    <label for="q2-b">Itachi</label>
                </li>
                <li>
                    <input type="radio" name="question2" id="q2-c" value="c" />
                    <label for="q2-c">Sasuke</label>
                </li>
                <li>
                    <input type="radio" name="question2" id="q2-d" value="d" />
                    <label for="q2-d">Naruto</label>
                </li>
            </ul>

            <h2>Question 3:</h2>
            <p>Who is Naruto's wife?</p>
            <ul>
                <li>
                    <input type="radio" name="question3" id="q3-a" value="a" />
                    <label for="q3-a">Sakura</label>
                </li>
                <li>
                    <input type="radio" name="question3" id="q3-b" value="b" />
                    <label for="q3-b">Hinata</label>
                </li>
                <li>
                    <input type="radio" name="question3" id="q3-c" value="c" />
                    <label for="q3-c">Ino</label>
                </li>
                <li>
                    <input type="radio" name="question3" id="q3-d" value="d" />
                    <label for="q3-d">Tenten</label>
                </li>
            </ul>
            <a id="submit">Submit</a>
        </section>
        <section id="results">
            <h2>Results</h2>
            <p>You got <span id="score"></span> out of 3 questions correct!</p>
        </section>
    </main>
    <script src="./script.js"></script>
</body>

</html>
